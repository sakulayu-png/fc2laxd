<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC2 & LAXD 充值服务 | 快速·安全·便捷</title>
    <meta name="description" content="专业的 FC2 和 LAXD 平台充值服务，快速到账、安全可靠、价格优惠。">
    <link rel="icon" href="assets/fc2-favicon.ico" type="image/x-icon">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --accent-light: #818cf8;
            --accent-dark: #3730a3;
            --border: #e5e7eb;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }

        /* ===== Full-screen Hero ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #fafbff 0%, #f0f1ff 50%, #eef0fc 100%);
        }

        /* Decorative background blobs */
        .hero::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            max-width: 760px;
            padding: 60px 24px;
        }

        /* Status badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(79, 70, 229, 0.15);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 36px;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Logo showcase */
        .logo-showcase {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
            margin-bottom: 44px;
        }

        .logo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .logo-item:hover {
            transform: scale(1.05);
        }

        .logo-item img {
            height: 64px;
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
        }

        .fc2-text-logo {
            display: inline-flex;
            align-items: center;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .fc2-text-logo .fc2-fc { color: #4f46e5; }
        .fc2-text-logo .fc2-2 { color: #f59e0b; }

        .logo-divider {
            width: 1px;
            height: 48px;
            background: linear-gradient(180deg, transparent, var(--border), transparent);
        }

        /* Title */
        .hero h1 {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .subtitle {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto 40px;
        }

        /* Feature pills */
        .features-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(79, 70, 229, 0.12);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text);
        }

        .feature-pill svg {
            width: 16px;
            height: 16px;
            color: var(--accent);
        }

        /* Contact card */
        .contact-card {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 56px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(79, 70, 229, 0.12);
        }

        .contact-card .qq-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ebf0ff 0%, #f5f3ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .contact-card .qq-icon svg {
            width: 30px;
            height: 30px;
        }

        .contact-card .label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .contact-card .value {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: var(--accent);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .logo-showcase { gap: 32px; }
            .fc2-text-logo { font-size: 2.2rem; }
            .logo-item img { height: 48px; }
            .logo-divider { height: 36px; }
            .contact-card { padding: 28px 36px; }
            .contact-card .value { font-size: 1.5rem; }
            .features-row { gap: 8px; }
            .feature-pill { padding: 8px 14px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

            <!-- Contact card -->

                <div class="qq-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4f46e5"><path d="M21.395 15.035a39.548 39.548 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 1 12 1S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39.547 39.547 0 0 0-.802 2.264c-1.021 3.282-.69 4.643-.438 4.673.54.065 2.103-2.473 2.103-2.473 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.077-.132.132-.458-.301-.778-.482-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.564 2.538 2.104 2.473.251-.03.582-1.391-.438-4.673z"/></svg>
                </div>
                <p class="label">QQ 联系充值</p>

        <div class="footer">

</body>
</html>
